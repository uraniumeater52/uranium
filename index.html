<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Code Runner</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #000;
      overflow: hidden;
    }
    #runBtn {
      position: fixed;
      top: 12px;
      right: 12px;
      z-index: 9999;
      padding: 8px 14px;
      font-size: 14px;
      cursor: pointer;
      border: 1px solid #555;
      background: #222;
      color: #eee;
      border-radius: 6px;
    }
    #runBtn:hover {
      background: #333;
    }
    iframe {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: none;
      background: #000;
    }
  </style>
</head>
<body>
  <button id="runBtn">Run Code</button>
  <iframe id="frame"></iframe>

  <script>
    const frame = document.getElementById('frame');
    const STORAGE_KEY = 'uranium-last-code';

    // autosave
    const saved = localStorage.getItem(STORAGE_KEY);
    if (saved) {
      frame.srcdoc = saved;
    }

    document.getElementById('runBtn').onclick = function () {
      const code = prompt('Paste your HTML / JS code here:');
      if (code === null) return;
      if (!code.trim()) {
        alert('No code entered.');
        return;
      }

      // save it
      localStorage.setItem(STORAGE_KEY, code);

      // run it
      frame.srcdoc = code;
    };
  </script>
</body>
</html>
