<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Code Runner</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: white;
      overflow: hidden;
    }
    #runBtn {
      position: fixed;
      top: 12px;
      right: 12px;
      z-index: 9999;
      padding: 8px 14px;
      font-size: 14px;
      cursor: pointer;
      border: 1px solid #ccc;
      background: #f5f5f5;
      border-radius: 4px;
    }
    #runBtn:hover {
      background: #e8e8e8;
    }
    iframe {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: none;
      background: white;
    }
  </style>
</head>
<body>
  <button id="runBtn">Run Code</button>
  <iframe id="frame" sandbox="allow-scripts allow-modals allow-same-origin allow-forms allow-popups"></iframe>

  <script>
    document.getElementById('runBtn').onclick = function () {
      const code = prompt('Type or paste your HTML / JS code here:');
      if (code === null) return;
      if (!code.trim()) {
        alert('No code entered.');
        return;
      }
      document.getElementById('frame').srcdoc = code;
